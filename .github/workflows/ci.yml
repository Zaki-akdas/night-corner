name: CI
# [smoke] preview-e2e verification branch — workflow-only comment

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + e2e
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=test_e2e
      NEXTAUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXTAUTH_URL: http://localhost:3100
      # Optional: set these GitHub secrets to also exercise the real delivery
      # photo upload path. Without them the e2e skips photo/DELIVERED-storage
      # assertions gracefully (same as a local run without storage config).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: End-to-end tests
        run: npm run test:e2e
