name: OTP cleanup (scheduled)

on:
  schedule:
    # Hourly sweep — OTPs live 10 minutes, so stale rows are removed well
    # before they could accumulate. Runs every hour at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  otp-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep expired OTP rows
        env:
          # Direct Postgres connection to the production database. Only
          # EmailOtp rows past expiresAt are touched.
          DB_URL: ${{ secrets.PROD_E2E_TEST_DB_URL }}
        run: node scripts/cleanup-expired-otp.mjs

      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "🧹 OTP cleanup failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["maintenance"],
            });
            const dup = existing.data.find((i) => i.title === title);
            const body = [
              `The hourly expired-OTP sweep failed at ${new Date().toISOString()}.`,
              "",
              "Run: " + context.serverUrl + "/" + context.repo.full_name + "/actions/runs/" + context.runId,
              "",
              "The EmailOtp table may be accumulating stale codes. Check the run logs, fix the root cause, then close this issue.",
            ].join("\n");
            if (dup) {
              await github.rest.issues.update({ ...context.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ["maintenance"],
              });
            }
