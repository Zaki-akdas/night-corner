name: Sweep delivery-proofs bucket

on:
  schedule:
    # Daily off-peak — cleans orphaned test photos the e2e couldn't remove
    # (e.g. legacy litter or a failed cleanup), so litter never accumulates.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List orphans without deleting"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sweep the delivery-proofs bucket
        id: sweep
        env:
          # Production database — live order IDs decide what is kept.
          E2E_TEST_DB_URL: ${{ secrets.PROD_E2E_TEST_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Required: the anon/publishable key cannot delete from the bucket.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sweep-delivery-proofs.mjs ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Open an issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = "🗑️ Scheduled delivery-proofs sweep failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["e2e"],
            });
            const dup = existing.data.find((i) => i.title === title);
            const body = [
              `The daily delivery-proofs bucket sweep failed at ${new Date().toISOString()}.`,
              "",
              "Run: " + context.serverUrl + "/" + context.repo.full_name + "/actions/runs/" + context.runId,
              "",
              "The sweep lists the bucket, cross-references live order IDs, and deletes orphaned test photos. A failure means litter can accumulate — check the logs (storage API, DB access, or a partial delete), fix it, then close this issue.",
            ].join("\n");
            if (dup) {
              await github.rest.issues.update({ ...context.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["e2e"] });
            }
