name: E2E against Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Only one E2E run at a time — all preview deployments share the same
# database (production public), so concurrent runs would race on the seed data.
concurrency:
  group: e2e-preview
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Vercel preview URL
        id: vercel
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("No pull request context — this workflow needs a PR-linked Vercel preview. A manual dispatch without a PR has no preview to test against; refusing to fall back to local e2e mode against the shared database.");
              return;
            }
            // Vercel's GitHub integration reports via a PR comment (the
            // "Vercel Preview Comments" app) containing the deployment link:
            //   [Preview](https://<project>-git-<branch>-<team>.vercel.app)
            const re = /\[Preview\]\(https:\/\/([^)\s]+\.vercel\.app)\)/;
            const deadline = Date.now() + 600_000;
            while (Date.now() < deadline) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              });
              for (const c of comments) {
                if (!/vercel/i.test(c.body || "")) continue;
                const m = (c.body || "").match(re);
                if (!m) continue;
                const url = `https://${m[1]}`;
                try {
                  const res = await fetch(`${url}/api/open-status`, {
                    signal: AbortSignal.timeout(10_000),
                  });
                  if (res.ok) {
                    core.setOutput("preview_url", url);
                    core.info(`preview URL resolved: ${url}`);
                    return;
                  }
                } catch { /* not ready yet — keep polling */ }
              }
              await new Promise((r) => setTimeout(r, 5_000));
            }
            core.setFailed("Timed out waiting for the Vercel preview deployment (no Ready preview URL in the PR comments within 10 minutes).");

      - name: Run E2E against the preview
        if: ${{ steps.vercel.outputs.preview_url != '' }}
        env:
          # The preview deployment URL (https://<project>-<hash>-<user>.vercel.app)
          E2E_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          # Pooled Postgres connection to the schema the deployment reads/writes
          # (the preview app shares production public). The schema is pinned in
          # the URL so pooled connections can't leak another client's search_path.
          E2E_TEST_DB_URL: ${{ secrets.E2E_TEST_DB_URL }}
          # Supabase storage — lets the staff photo-upload success path run
          # (and clean up after itself) instead of skipping.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run test:e2e
