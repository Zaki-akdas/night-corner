name: E2E against Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Only one E2E run at a time — all preview deployments share the preview_e2e
# test schema, so concurrent runs would race on the seed data.
concurrency:
  group: e2e-preview
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Vercel preview deployment
        id: vercel
        uses: patrickedqvist/wait-for-vercel-preview@v1.3.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          max_timeout: 600

      - name: Run E2E against the preview
        env:
          # The preview deployment URL (https://<project>-<hash>-<user>.vercel.app)
          E2E_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          # Direct Postgres connection to the preview_e2e test schema. This is
          # the same schema the preview deployment reads/writes via its own
          # preview-scoped DATABASE_URL.
          E2E_TEST_DB_URL: ${{ secrets.E2E_TEST_DB_URL }}
        run: npm run test:e2e
