name: E2E against Production (scheduled)

on:
  schedule:
    # Nightly health check — runs while the shop is typically closed for
    # business (13:00 UTC ≈ 18:30 IST evening), so a failed order flow is
    # noticed before peak night hours.
    - cron: "0 13 * * *"
  workflow_dispatch:

# Only one production E2E run at a time — the script temporarily overwrites the
# shared app_settings row and restores it in cleanup, so concurrent runs would
# race on the backup/restore.
concurrency:
  group: e2e-prod
  cancel-in-progress: false

jobs:
  e2e-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run E2E against production
        id: e2e
        env:
          # The live production deployment.
          E2E_BASE_URL: https://night-corner.vercel.app
          # Direct Postgres connection to the production database. The E2E
          # backs up app_settings before seeding and restores it in cleanup
          # (the "restored app_settings to pre-run values" step), so the live
          # shop's hours/location are never left pointing at test values.
          E2E_TEST_DB_URL: ${{ secrets.PROD_E2E_TEST_DB_URL }}
        run: npm run test:e2e

      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⏰ Scheduled production E2E failed";
            // Don't pile up duplicate issues — reuse the latest open one.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: ["e2e"],
            });
            const dup = existing.data.find((i) => i.title === title);
            const body = [
              `The nightly production E2E failed at ${new Date().toISOString()}.`,
              "",
              "Run: " + context.serverUrl + "/" + context.repo.full_name + "/actions/runs/" + context.runId,
              "",
              "This means the signup → login → order → persistence flow, the admin/delivery panels, or the dynamic-route sweep failed against the live deployment.",
              "",
              "Check the run logs, fix the root cause, then close this issue.",
            ].join("\n");
            if (dup) {
              await github.rest.issues.update({ ...context.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ["e2e"],
              });
            }
