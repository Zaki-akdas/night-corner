<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1f2560"/>
      <stop offset="55%" stop-color="#0a0c1e"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <g opacity="0.5"><circle cx="90" cy="90" r="1.5" fill="#fff"/><circle cx="510" cy="130" r="1.2" fill="#c4b5fd"/><circle cx="150" cy="220" r="1" fill="#fff"/><circle cx="480" cy="260" r="1.6" fill="#bae6fd"/><circle cx="80" cy="430" r="1.2" fill="#fff"/></g>
  <circle cx="300" cy="340" r="230" fill="url(#glow)"/>
  <!-- reflective floor -->
  <ellipse cx="300" cy="530" rx="190" ry="30" fill="url(#floor)"/>
  <ellipse cx="300" cy="532" rx="120" ry="12" fill="#000" opacity="0.45"/>
  <g transform="translate(0 0) rotate(6 300 320)">
    <linearGradient id="pack" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#fca5a5"/>
    <stop offset="50%" stop-color="#ef4444"/>
    <stop offset="100%" stop-color="#7f1d1d"/>
  </linearGradient>
    <g transform="translate(0 20) scale(0.85)" opacity="0.35">
    <g>
      <rect x="180" y="170" width="240" height="280" rx="22" fill="url(#pack)" stroke="#fca5a5" stroke-width="3"/>
      <path d="M180 170 L420 170 L400 140 L200 140 Z" fill="#7f1d1d"/>
      <rect x="218" y="270" width="164" height="130" rx="14" fill="#05060f" opacity="0.82"/>
      <text x="300" y="330" text-anchor="middle" font-family="Arial Black" font-size="28" fill="#fff">Yippee</text>
      <text x="300" y="360" text-anchor="middle" font-size="13" fill="#fca5a5"></text>
      <circle cx="220" cy="210" r="16" fill="#fff" opacity="0.2"/>
    </g></g>
    <g transform="translate(0 -40)">
      <text x="300" y="330" text-anchor="middle" font-size="160" filter="url(#soft)">🍜</text>
      <text x="300" y="330" text-anchor="middle" font-size="160">🍜</text>
    </g>
    <g opacity="0.8">
      <circle cx="160" cy="180" r="6" fill="#fff"/>
      <circle cx="440" cy="220" r="4" fill="#fca5a5"/>
      <circle cx="420" cy="420" r="5" fill="#fff"/>
    </g></g>
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="300" y="572" font-size="13" letter-spacing="3" fill="#64748b">NIGHT CORNER</text>
  </g>
</svg>